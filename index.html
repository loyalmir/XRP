<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BC룸 라운지</title>
<meta name="theme-color" content="#0F2A47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BC룸">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5;--card:#FFFFFF;--ink:#14213D;--muted:#5F6B7A;--line:#DCE1E8;--chip:#EEF1F5;
  --navy:#0F2A47;--navy-ink:#FFFFFF;--navy-muted:#A9B8CC;
  --amber:#F5B700;--amber-ink:#2E2300;--green:#1F9D6B;--green-soft:#DDF3EA;--red:#D64545;--red-soft:#FBE3E3;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1520;--card:#162231;--ink:#E8EDF4;--muted:#9AA7B8;--line:#26364A;--chip:#1E2D40;
  --navy:#08192B;--navy-muted:#7F93AD;--green-soft:#123A2C;--red-soft:#3D1C1F;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1520;--card:#162231;--ink:#E8EDF4;--muted:#9AA7B8;--line:#26364A;--chip:#1E2D40;
  --navy:#08192B;--navy-muted:#7F93AD;--green-soft:#123A2C;--red-soft:#3D1C1F;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
img{max-width:100%}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink);padding:8px 12px;display:flex;align-items:center;gap:10px}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.place{font-weight:600;font-size:14px}
.sync{font-size:12px;color:var(--navy-muted)}
.clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--navy-muted)}
.hero{flex:1;min-width:0;border-radius:10px;padding:6px 10px;background:rgba(255,255,255,.08);display:block;text-align:left;border:0;color:inherit}
.hero .hb{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.hero .hl{font-size:12.5px;color:var(--navy-muted)}
.hero .ht{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.hero .hd{font-size:13px;font-weight:500}
.hero .hn{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.status{font-size:12.5px;color:var(--muted);margin:-4px 2px 12px}
.rtabs{display:flex;gap:6px;margin:0 0 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:10;background:var(--bg);padding:6px 0}
.rtabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 2px;font-weight:600;font-size:14px;line-height:1.25}
.rtabs button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.rtabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.rtabs button.on small{color:inherit;opacity:.75}
.hero.urgent{background:var(--amber);color:var(--amber-ink)}
.hero.urgent .hl{color:var(--amber-ink);font-weight:600}
.live{margin-top:6px;font-size:12.5px;color:var(--navy-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{padding:14px 14px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:12px 0 13px;font-size:14px;color:var(--muted);font-weight:500}
nav button[aria-selected="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--amber)}

h2{font-size:18px;margin:6px 2px 10px}
.note{font-size:13px;color:var(--muted);margin:0 2px 12px}

/* sessions */
.sess{display:grid;grid-template-columns:62px 1fr;gap:10px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--line)}
.sess .tm b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.sess .tm span{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sess .tm em{display:inline-block;margin-top:6px;font-style:normal;font-size:12px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--chip);font-variant-numeric:tabular-nums}
.sess.callnow{border:2px solid var(--amber)}
.sess.callnow .tm em{background:var(--amber);color:var(--amber-ink)}
.sess.onstage{border-left:5px solid var(--green)}
.sess.past{opacity:.55}
.stype{font-size:12px;color:var(--muted)}
.stitle{font-weight:600;font-size:14.5px;line-height:1.4}
.sps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.spc{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:3px 10px 3px 3px;font-size:13px}
.spc{padding:0;overflow:hidden}
.spc .avb{border:0;background:none;padding:3px 0 3px 3px;display:flex}
.spc .nmb{border:0;background:none;display:flex;align-items:center;gap:6px;padding:7px 10px 7px 6px;font-size:13.5px;font-weight:500}
.spc .dot{width:7px;height:7px;border-radius:50%;background:var(--red)}
.spc.in .dot{background:var(--green)}
.spc .lbl{font-size:11.5px;font-weight:700;padding:0 6px;border-radius:5px}
.spc.c1{border-color:var(--amber);background:var(--amber);color:var(--amber-ink)}
.spc.c1 .lbl{background:rgba(0,0,0,.12)}
.spc.c2{border-color:var(--green);background:var(--green);color:#fff}
.spc.c2 .lbl{background:rgba(255,255,255,.2)}
.prog{font-size:12.5px;color:var(--muted);margin-top:8px}
.av{width:26px;height:26px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:12px;font-weight:600;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.acts{display:flex;gap:6px;margin-top:10px}
.tg{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 6px;font-size:13.5px;font-weight:500}
.tg.on{background:var(--green);border-color:var(--green);color:#fff}
.miss{font-size:12px;color:var(--red);margin-top:6px;font-weight:500}

/* speakers */
.search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);margin-bottom:10px}
.sprow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.sprow .av{width:48px;height:48px;font-size:17px}
.sprow .nm{font-weight:600}
.sprow .sub{font-size:12.5px;color:var(--muted)}
.sprow .grow{flex:1;min-width:0}
.sprow .when{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;text-align:right}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px;margin-top:3px}
.badge.in{background:var(--green-soft);color:var(--green)}
.badge.out{background:var(--red-soft);color:var(--red)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0;font-size:17px}
.card .use{font-size:13px;color:var(--muted);margin-bottom:10px}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.in-t{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg)}
textarea.in-t{min-height:64px;resize:vertical}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 4px;font-size:13px}
.seg button.on{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:600}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.photos button{aspect-ratio:1;border-radius:9px;border:1px dashed var(--line);background:var(--bg);padding:0;overflow:hidden;font-size:12.5px;color:var(--muted)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.person{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.person .av{width:42px;height:42px}
.person .grow{flex:1;min-width:0}
.person .sub{font-size:12.5px;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:13px;padding:6px}
.addp{display:grid;grid-template-columns:52px 1fr;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.addp .cam{width:52px;height:52px;border-radius:50%;border:1px dashed var(--line);background:var(--bg);padding:0;overflow:hidden;font-size:11.5px;color:var(--muted)}
.addp .cam img{width:100%;height:100%;object-fit:cover}
.addp .fields{display:grid;gap:6px}
.btn{border:0;background:var(--ink);color:var(--card);border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}

/* qa */
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.q.ok{border-color:var(--green)}
.q .qt{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14.5px}
.q .qt input{width:20px;height:20px;margin-top:2px;accent-color:var(--green);flex:none}
.q textarea{margin-top:8px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(5,12,22,.55);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.sh{background:var(--card);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sh .big{width:100%;aspect-ratio:4/5;max-height:46vh;border-radius:12px;background:var(--chip);display:grid;place-items:center;overflow:hidden;border:0;padding:0;color:var(--muted);font-size:15px}
.sh .big img{width:100%;height:100%;object-fit:cover}
.sh .nm{font-size:21px;font-weight:700;margin-top:12px}
.sh .en{color:var(--muted);font-size:14px}
.sh .org{font-size:14px;margin-top:2px}
.sh ul{margin:8px 0 0;padding:0;list-style:none}
.sh li{font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)}
.sh li b{font-variant-numeric:tabular-nums;margin-right:6px}
.viewer img{width:100%;border-radius:12px;display:block}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 14px;border-radius:10px;font-size:13.5px;z-index:50;display:none;max-width:90%}
@media (prefers-reduced-motion:no-preference){.hero.urgent{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{filter:brightness(1.08)}}
</style>
</head>
<body>
<header>
  <button class="hero" id="hero" type="button"></button>
  <span class="clock" id="clock">--:--</span>
</header>
<main id="view"></main>
<nav role="tablist">
  <button role="tab" data-tab="call">콜 순서</button>
  <button role="tab" data-tab="sp">연사</button>
  <button role="tab" data-tab="room">방</button>
  <button role="tab" data-tab="qa">확인사항</button>
</nav>
<div id="sheet"><div class="sh" id="sh"></div></div>
<div id="toast"></div>
<input type="file" id="picker" accept="image/*" capture="environment" hidden>

  ["s10","14:35","14:50","키노트","XRPL 대중화, 무엇을 준비해야 하나",["ayo-akinyele"]],
  ["s11","14:50","15:05","키노트","날씨 데이터 비즈니스의 새로운 기회",["sunghwan-kim"]],

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("bc-lounge",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

async function idbGet(k){const d=await getDB();return new Promise((res,rej)=>{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const d=await getDB();return new Promise((res,rej)=>{const tx=d.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

const $=s=>document.querySelector(s);

const fmt=m=>{m=Math.round(m);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};

const offset=()=>Number((store.qa.settings||{}).callOffset)||20;

function flash(t){const el=$("#toast");el.textContent=t;el.style.display="block";clearTimeout(flash.t);flash.t=setTimeout(()=>el.style.display="none",2600)}
function saveCache(){
  try{localStorage.setItem(LS+"-tab",tab)}catch(e){}

function put(coll,id,data){
  store[coll]=Object.assign({},store[coll],{[id]:data});

}
function patch(coll,id,f){put(coll,id,Object.assign({},store[coll][id]||{},f,{t:Date.now()}))}
function remove(coll,id){
  const c=Object.assign({},store[coll]);delete c[id];store[coll]=c;saveCache();schedule();
}

function schedule(){
  const a=document.activeElement;
  if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&a.type!=="checkbox"&&a.type!=="file"){pendingRender=true;return}
  requestAnimationFrame(renderAll);
}
document.addEventListener("focusout",()=>{if(pendingRender){pendingRender=false;setTimeout(()=>schedule(),50)}});

function renderHero(){
  const n=nowM(),off=offset();
  const d=new Date();$("#clock").textContent=d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false});
  const nx=SESS.find(s=>!isCalled(s)&&toM(s.s)>n);
  const h=$("#hero");
  if(nx){
    const call=toM(nx.s)-off,left=Math.ceil(call-n),urgent=left<=0;
    h.className="hero"+(urgent?" urgent":"");h.dataset.goto=nx.id;
    const names=nx.sp.filter(id=>cst(nx.id,id)<1).map(id=>SP[id][0]).join(", ");
    h.innerHTML=`<div class="hb"><span class="hl">${urgent?"지금 콜":"다음 콜"}</span><span class="ht">${fmt(call)}</span><span class="hd">${urgent?`무대 ${Math.max(0,Math.ceil(toM(nx.s)-n))}분 전`:left>=60?`${Math.floor(left/60)}시간 ${left%60}분 후`:`${left}분 후`}</span></div><div class="hn">${esc(nx.type)} ${esc(names)}</div>`;
  }else{h.className="hero";delete h.dataset.goto;h.innerHTML=`<div class="hb"><span class="hl">남은 콜</span><span class="ht">없음</span></div><div class="hn">오늘 콜을 모두 마쳤어.</div>`}
}

function renderView(){

function viewCall(){
  const n=nowM(),off=offset();
  const live=SESS.find(s=>n>=toM(s.s)&&n<toM(s.e)),done=SESS.filter(isCalled).length;
  return `<h2>세션별 콜 순서</h2><p class="note">이름을 누를 때마다 콜, 인계, 대기 순서로 바뀌어. 얼굴을 누르면 연사 정보가 열려. 콜은 세션 시작 ${off}분 전 기준이야.</p><p class="status">콜 완료 ${done}/${SESS.length}${live?`, 지금 무대: ${esc(live.type)} ${esc(live.title)}`:""}<br>${esc(syncText)}</p>`+SESS.map(s=>{
    const st=sst(s.id),call=toM(s.s)-off,start=toM(s.s),end=toM(s.e);
    let cls="sess";
    if(n>=end)cls+=" past";else if(n>=start)cls+=" onstage";else if(n>=call&&!isCalled(s))cls+=" callnow";
    const missing=s.sp.filter(id=>!spd(id).arrived).length;
    return `<div class="${cls}" id="row-${s.id}"><div class="tm"><b>${s.s}</b><span>~${s.e}</span><em>콜 ${fmt(call)}</em></div><div>
      <div class="stype">${esc(s.type)}</div><div class="stitle">${esc(s.title)}</div>
      <div class="sps">${s.sp.map(id=>{const c=cst(s.id,id);return `<span class="spc${spd(id).arrived?" in":""}${c?" c"+c:""}"><button class="avb" data-sp="${id}" aria-label="${esc(SP[id][0])} 정보">${avatar(spd(id).photo,SP[id][0])}</button><button class="nmb" data-cyc="${s.id}|${id}">${esc(SP[id][0])}${c?`<span class="lbl">${c===1?"콜":"인계"}</span>`:`<span class="dot"></span>`}</button></span>`}).join("")}</div>
      ${missing&&n<start?`<div class="miss">라운지 미도착 ${missing}명</div>`:""}
      <div class="prog">콜 ${s.sp.filter(id=>cst(s.id,id)>=1).length}/${s.sp.length}, 인계 ${s.sp.filter(id=>cst(s.id,id)>=2).length}/${s.sp.length}</div>
    </div></div>`}).join("");
}

function shrink(file,max=560,q=.72){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}

$("#picker").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";if(!f||!pick)return;
  let data;try{data=await shrink(f)}catch(_){flash("사진을 읽지 못했어. 다른 사진으로 해줘.");return}
  const[kind,id]=pick;
  if(kind==="speaker")patch("speakers",id,{photo:data});
  else if(kind==="roomphoto"){const pid="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);put("roomphotos",pid,{room:id,img:data,t:Date.now()})}
  else if(kind==="draft"){drafts[id]=Object.assign(drafts[id]||{},{photo:data,name:($("#pn-"+id)||{}).value,org:($("#po-"+id)||{}).value});schedule()}
});

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-goto]");
  if(e.target.id==="sheet"){closeSheet();return}
  if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;saveCache();$("#view").innerHTML="";renderView();window.scrollTo(0,0);return}
  if(t.id==="hero"&&t.dataset.goto){if(tab!=="call"){tab="call";renderView()}const r=$("#row-"+t.dataset.goto);if(r)r.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.dataset.room){roomSel=t.dataset.room;try{localStorage.setItem(LS+"-room",roomSel)}catch(_){}renderView();window.scrollTo(0,0);return}
  if(t.dataset.cyc){const[sid,spid]=t.dataset.cyc.split("|");const m=Object.assign({},sst(sid).sp||{});m[spid]=((m[spid]||0)+1)%3;patch("sessions",sid,{sp:m});return}
  if(t.dataset.sp){openSpeaker(t.dataset.sp);return}
  if(t.dataset.tg){const[c,id,f]=t.dataset.tg.split("|");patch(c,id,{[f]:!(store[c][id]||{})[f]});return}
  if(t.dataset.set){const[c,id,f,v]=t.dataset.set.split("|");patch(c,id,{[f]:f==="callOffset"?Number(v):v});return}
  if(t.dataset.pick){pick=t.dataset.pick.split("|");if(pick[0]==="draft")drafts[pick[1]]=Object.assign(drafts[pick[1]]||{},{name:($("#pn-"+pick[1])||{}).value,org:($("#po-"+pick[1])||{}).value});$("#picker").click();return}
  if(t.dataset.view){const[c,id]=t.dataset.view.split("|");openViewer(c,id);return}
  if(t.dataset.del){const[c,id]=t.dataset.del.split("|");if(confirm("삭제할까?")){remove(c,id);if(c==="roomphotos")closeSheet()}return}
  if(t.dataset.close!==undefined){closeSheet();return}
  if(t.dataset.add){const r=t.dataset.add,name=$("#pn-"+r).value.trim(),org=$("#po-"+r).value.trim();
    if(!name){flash("이름을 먼저 적어줘.");$("#pn-"+r).focus();return}
    const pid="m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    put("people",pid,{room:r,name,org,photo:(drafts[r]||{}).photo||"",t:Date.now()});delete drafts[r];document.activeElement&&document.activeElement.blur();schedule();flash(name+" 추가함");return}
  if(t.id==="addq"){const v=$("#newq").value.trim();if(!v)return;const qid="c"+Date.now().toString(36);put("qa",qid,{text:v,custom:true,c:Date.now()});$("#newq").value="";return}
});
const timers={};
function fieldSave(el){const[c,id,f]=el.dataset.f.split("|");if(((store[c][id]||{})[f]||"")===el.value)return;patch(c,id,{[f]:el.value})}
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="spsearch"){spQuery=el.value;$("#splist").innerHTML=viewSpList();return}
  if(el.dataset.f){clearTimeout(timers[el.dataset.f]);timers[el.dataset.f]=setTimeout(()=>fieldSave(el),700)}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.f){clearTimeout(timers[el.dataset.f]);fieldSave(el)}
  if(el.dataset.ck){const[c,id,f]=el.dataset.ck.split("|");patch(c,id,{[f]:el.checked})}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if(e.key==="Enter"&&e.target.id==="newq")$("#addq").click()});

setInterval(()=>{$("#clock").textContent=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false})},5000);
setInterval(()=>{renderHero();if(tab==="call")schedule()},30000);

renderAll();
idbGet("store").then(v=>{
  if(v)store=Object.assign(store,v);
  syncText="입력하면 이 폰에 자동 저장돼.";renderAll();
}).catch(()=>{syncText="저장소를 열지 못했어. 사파리나 크롬에서 열어줘.";renderAll()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
document.addEventListener("visibilitychange",()=>{if(document.hidden){clearTimeout(saveCache.t);idbSet("store",store).catch(()=>{})}});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
